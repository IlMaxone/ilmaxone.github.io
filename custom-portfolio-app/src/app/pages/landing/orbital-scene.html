<div
  #viewport
  class="orbital-viewport"
  [class.orbital-viewport--dragging]="isDragging"
  (wheel)="onWheel($event)"
  (pointerdown)="startPointer($event)"
  (pointermove)="movePointer($event)"
  (pointerup)="endPointer($event)"
  (pointercancel)="endPointer($event)"
  (pointerleave)="clearHover()"
>
  <canvas
    #canvas
    class="orbital-canvas"
    tabindex="0"
    role="application"
    aria-label="Sistema planetario WebGL. Trascina per ruotare a 360 gradi, usa la rotella per lo zoom e le frecce per orientare la camera."
    (keydown)="onKeydown($event)"
  ></canvas>

  <div class="orbit-labels" [attr.aria-label]="navigationMode ? 'Sezioni in orbita' : 'Contenuti in orbita'">
    @for (experience of experiences; track experience.id; let index = $index) {
      <button
        #labelElement
        type="button"
        class="orbit-label"
        [class.orbit-label--selected]="index === selectedIndex"
        [attr.aria-label]="(navigationMode ? 'Apri sezione ' : 'Seleziona pianeta ') + experience.shortLabel"
        [attr.aria-current]="index === selectedIndex ? 'true' : null"
        (click)="selectExperience(index)"
        (focus)="focusPlanet(index)"
        (blur)="focusPlanet(null)"
      >
        <strong>{{ experience.shortLabel }}</strong>
      </button>
    }
  </div>

  @if (fallbackVisible) {
    <div class="webgl-fallback" role="status">
      <strong>WebGL non disponibile</strong>
      <span>Usa le etichette per navigare tra i pianeti.</span>
    </div>
  }

  <div class="scene-status" role="status" aria-live="polite">
    <span class="scene-status__motion" [class.scene-status__motion--paused]="motionPaused"><i></i>{{ motionStatus }}</span>
    <span>360° WebGL</span>
    <span>{{ experiences.length }} pianeti</span>
    <span>{{ distance.toFixed(1) }} AU</span>
  </div>

  <div class="scene-controls" aria-label="Controlli della scena tridimensionale">
    <button type="button" class="scene-controls__stellar scene-controls__stellar--left" (click)="rotateCamera(18)" aria-label="Ruota a sinistra">
      <span class="stellar-arrow-shape" aria-hidden="true"></span>
    </button>
    <button type="button" class="scene-controls__reset" (click)="resetView()">Reset</button>
    <button
      type="button"
      class="scene-controls__motion"
      [class.scene-controls__motion--paused]="manualPaused"
      [attr.aria-label]="manualPaused ? 'Riprendi la rotazione cosmica' : 'Metti in pausa la rotazione cosmica'"
      [attr.aria-pressed]="manualPaused"
      (click)="toggleManualPause()"
    >
      <span class="motion-symbol" aria-hidden="true"><i></i><i></i></span>
    </button>
    <button type="button" class="scene-controls__stellar scene-controls__stellar--right" (click)="rotateCamera(-18)" aria-label="Ruota a destra">
      <span class="stellar-arrow-shape" aria-hidden="true"></span>
    </button>
  </div>

  <p class="scene-hint"><span></span> Trascina · zoom · seleziona</p>
</div>
